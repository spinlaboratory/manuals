baseURL = "https://spinlaboratory.github.io/manuals/"

locale = 'en-us'

title = 'Manuals'

theme = ["github.com/google/docsy", "github.com/google/docsy/dependencies"]

relativeURLs = false
canonifyURLs = true

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableMissingTranslationPlaceholders = true
enableRobotsTXT = true
enableGitInfo = true

# Taxonomies
[taxonomies]
tag = "tags"
category = "categories"

[params.taxonomy]
taxonomyCloud = ["tags", "categories"]
taxonomyCloudTitle = ["Tag Cloud", "Categories"]
taxonomyPageHeader = ["tags", "categories"]

# Syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

# URL structure
[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

# Image processing
[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

# Language configuration
[languages]
[languages.en]
title = "Manuals"
label = "English"
weight = 1

[languages.en.params]
description = "Manuals"

# Markup
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "tango"
linenos = true

# Output formats
[outputs]
section = ["HTML", "print", "RSS"]

# Site parameters
[params]
copyright = "Bruker BioSpin"
privacy_policy = "https://www.bruker.com/"

version_menu = "Releases"
archived_version = false
version = "0.1"
url_latest_version = "https://spinlaboratory.github.io/manuals/"

# Disable in-page GitHub edit/issue links
github_repo = ""
github_project_repo = ""

offlineSearch = true
prism_syntax_highlighting = false

# User interface
[params.ui]
breadcrumb_disable = false
footer_about_enable = false
navbar_logo = false
navbar_translucent_over_cover_disable = false
sidebar_menu_compact = true
sidebar_search_disable = false

[params.ui.feedback]
enable = false

[params.ui.readingtime]
enable = false

# KaTeX math rendering
[params.katex]
enable = true

# Hugo module configuration
[module]
proxy = "direct"

[module.hugoVersion]
extended = true
min = "0.157.0"

[[module.imports]]
path = "github.com/google/docsy"
disable = false

[[module.imports]]
path = "github.com/google/docsy/dependencies"
disable = false

# Cache
[caches]
[caches.images]
dir = ':cacheDir/images'