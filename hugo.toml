baseURL = "https://spinlaboratory.github.io/manuals/"
languageCode = "en-us"
title = "Manuals"

theme = ["github.com/google/docsy", "github.com/google/docsy/dependencies"]

relativeURLs = false
canonifyURLs = false

# Language settings
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableMissingTranslationPlaceholders = true
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
tag = "tags"
category = "categories"

[params.taxonomy]
taxonomyCloud = ["tags", "categories"]
taxonomyCloudTitle = ["Tag Cloud", "Categories"]
taxonomyPageHeader = ["tags", "categories"]

# Highlighting
pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsUseClassic = false
pygmentsStyle = "tango"

[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

[blackfriday]
plainIDAnchors = true
hrefTargetBlank = true
angledQuotes = false
latexDashes = true

[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

[languages]
[languages.en]
title = "Manuals"
label = "English"
weight = 1

[languages.en.params]
description = "Manuals"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "tango"
    linenos = true

[outputs]
section = ["HTML", "print", "RSS"]

[params]
copyright = "Bruker BioSpin"
privacy_policy = "https://www.bruker.com/"
version_menu = "Releases"
archived_version = false
version = "0.1"
url_latest_version = "https://example.com"

github_repo = "https://github.com/google/docsy-example"
github_project_repo = "https://github.com/google/docsy"

offlineSearch = false
prism_syntax_highlighting = false

navbar_logo = false

# ✅ UI CONFIG (single clean block)
[params.ui]
breadcrumb_disable = false
footer_about_enable = false
navbar_translucent_over_cover_disable = false
sidebar_menu_compact = true
sidebar_search_disable = false



# ✅ LOGO CONFIG (fixed)
# [params.ui.navbar_logo]
# src = "images/logo/logo.png"
# alt = "Manuals"
# width = 150

# ✅ FEEDBACK (fixed nesting)
[params.ui.feedback]
enable = false
yes = "Glad to hear it! Please <a href=\"https://github.com/USERNAME/REPOSITORY/issues/new\">tell us how we can improve</a>."
no = "Sorry to hear that. Please <a href=\"https://github.com/USERNAME/REPOSITORY/issues/new\">tell us how we can improve</a>."

# ✅ READING TIME
[params.ui.readingtime]
enable = false

[params.links]

[module]
  proxy = "direct"

  [module.hugoVersion]
    extended = true
    min = "0.157.0"

  [[module.imports]]
    path = "github.com/google/docsy"

  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[params.katex]
enable = true